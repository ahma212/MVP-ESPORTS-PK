<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <title>MVP ESPORTS</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Browser Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- Apple / iPhone Home Screen Icon -->
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#000000" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="MVP ESPORTS"
    />

    <!-- SEO -->
    <meta
      name="description"
      content="Join MVP Esports PK for daily PUBG Mobile custom rooms and esports tournaments in Pakistan. Win cash prizes!"
    />
    <meta
      name="keywords"
      content="MVP Esports PK, PUBG Mobile Tournament Pakistan, PUBG Custom Rooms, Esports PK"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      window.deferredPwaPrompt = null;

      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        window.deferredPwaPrompt = e;
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch((err) => {
            console.log("SW registration skipped:", err);
          });
        });
      }
    </script>
  </body>
</html>
